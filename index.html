<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Kill The Red</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginScreen" class="screen">

    <div class="loginBox">

        <h1>KILL THE RED</h1>
        <p class="subtitle">2D Forest Survival</p>

        <input
            id="username"
            type="text"
            placeholder="Username"
            maxlength="20"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="loginBtn">
            LOGIN
        </button>

        <p id="loginMessage"></p>

    </div>

</section>


<!-- ================= MENU ================= -->

<section id="menuScreen" class="screen hidden">

    <div class="menuBox">

        <h1>KILL THE RED</h1>

        <p>
            Selamat datang,
            <b id="playerName"></b>
        </p>

        <button id="startBtn">
            ▶ MULAI GAME
        </button>

        <button id="leaderboardBtn">
            🏆 LEADERBOARD
        </button>

        <button id="logoutBtn">
            LOGOUT
        </button>

    </div>

</section>


<!-- ================= GAME ================= -->

<section id="gameScreen" class="hidden">

    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->

    <div id="hud">

        <div class="hudLeft">

            <div class="hudItem">
                LEVEL:
                <span id="levelText">1</span>
            </div>

            <div class="hudItem">
                SCORE:
                <span id="scoreText">0</span>
            </div>

        </div>

        <div class="healthBox">

            <span>HP</span>

            <div class="healthOuter">
                <div id="healthBar"></div>
            </div>

            <span id="healthText">100 / 100</span>

        </div>

    </div>


    <!-- Cheat -->

    <button id="cheatOpen">
        🔑
    </button>

    <div id="cheatBox" class="hidden">

        <input
            id="cheatInput"
            type="text"
            placeholder="Masukkan kode cheat"
        >

        <button id="cheatBtn">
            AKTIFKAN
        </button>

        <p id="cheatMessage"></p>

    </div>


    <!-- Virtual controls -->

    <div id="controls">

        <div id="joystick">

            <div id="joystickBase">
                <div id="joystickKnob"></div>
            </div>

        </div>

        <button id="attackBtn">
            ⚡
        </button>

    </div>


    <!-- Game over -->

    <div id="gameOver" class="overlay hidden">

        <div class="gameOverBox">

            <h2>GAME OVER</h2>

            <p>
                Score:
                <strong id="finalScore">0</strong>
            </p>

            <button id="retryBtn">
                COBA LAGI
            </button>

            <button id="menuBtn">
                MENU
            </button>

        </div>

    </div>

</section>


<!-- ================= LEADERBOARD ================= -->

<section id="leaderboardScreen"
         class="screen hidden">

    <div class="leaderboardBox">

        <h1>🏆 LEADERBOARD</h1>

        <div id="leaderboardList">
            Memuat data...
        </div>

        <button id="backMenuBtn">
            ← KEMBALI
        </button>

    </div>

</section>


<script src="game.js"></script>

</body>
      </html>
