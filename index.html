<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>KILL THE RED</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginScreen" class="screen">

    <div class="loginBox">

        <h1>KILL THE RED</h1>

        <p class="subtitle">
            Enter the forest and survive.
        </p>

        <input
            type="text"
            id="username"
            placeholder="Username"
            maxlength="20"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            maxlength="30"
        >

        <button id="loginButton">
            LOGIN
        </button>

        <p id="loginMessage"></p>

        <button id="showLeaderboardFromLogin" class="secondaryButton">
            LEADERBOARD
        </button>

    </div>

</div>


<!-- ================= MENU ================= -->

<div id="menuScreen" class="screen hidden">

    <div class="menuBox">

        <h1>KILL THE RED</h1>

        <p>
            Welcome, <span id="menuUsername"></span>
        </p>

        <button id="startGameButton">
            START GAME
        </button>

        <button id="leaderboardButton" class="secondaryButton">
            LEADERBOARD
        </button>

        <button id="logoutButton" class="dangerButton">
            LOGOUT
        </button>

    </div>

</div>


<!-- ================= LEADERBOARD ================= -->

<div id="leaderboardScreen" class="screen hidden">

    <div class="leaderboardBox">

        <h1>🏆 LEADERBOARD</h1>

        <div id="leaderboardList">
            Loading...
        </div>

        <button id="backFromLeaderboard">
            BACK
        </button>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="gameScreen" class="hidden">

    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->

    <div id="hud">

        <div class="hudLeft">

            <div class="playerInfo">
                <span>PLAYER:</span>
                <b id="hudUsername">---</b>
            </div>

            <div class="hpContainer">

                <span>HP</span>

                <div class="hpBar">
                    <div id="hpFill"></div>
                </div>

                <span id="hpText">100 / 100</span>

            </div>

        </div>


        <div class="hudCenter">

            <div>
                LEVEL
                <b id="levelText">1</b>
            </div>

            <div>
                SCORE
                <b id="scoreText">0</b>
            </div>

        </div>


        <div class="hudRight">

            <div>
                WEAPON
                <b id="weaponText">PISTOL</b>
            </div>

            <!-- CHEAT -->

            <div class="cheatBox">

                <input
                    id="cheatInput"
                    type="text"
                    placeholder="CHEAT CODE"
                    autocomplete="off"
                >

                <button id="cheatButton">
                    ✓
                </button>

            </div>

            <div id="cheatMessage"></div>

        </div>

    </div>


    <!-- Mobile controls -->

    <div id="mobileControls">

        <div id="joystick">

            <div id="joystickBase">

                <div id="joystickKnob"></div>

            </div>

        </div>

        <button id="fireButton">
            🔥
        </button>

    </div>


    <!-- PC instruction -->

    <div id="desktopControls">
        WASD / Arrow Keys = Move &nbsp;&nbsp; Mouse = Aim &nbsp;&nbsp; Click = Shoot
    </div>


    <!-- GAME OVER -->

    <div id="gameOverScreen" class="overlay hidden">

        <div class="gameOverBox">

            <h1>GAME OVER</h1>

            <p>
                Score:
                <b id="finalScore">0</b>
            </p>

            <p>
                Level:
                <b id="finalLevel">1</b>
            </p>

            <button id="saveScoreButton">
                SAVE SCORE
            </button>

            <button id="restartButton">
                PLAY AGAIN
            </button>

            <button id="gameLeaderboardButton">
                LEADERBOARD
            </button>

            <button id="exitGameButton" class="dangerButton">
                EXIT
            </button>

        </div>

    </div>

</div>


<script src="game.js"></script>

</body>
  </html>
