<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Kill The Red</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginScreen" class="screen">

    <div class="loginBox">

        <h1>KILL <span>THE RED</span></h1>

        <p>2D Forest Shooter</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
            maxlength="20"
        >

        <input
            type="password"
            id="password"
            placeholder="Password minimal 10 karakter"
        >

        <button onclick="login()">
            LOGIN & MULAI
        </button>

        <div id="loginError"></div>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="gameScreen" class="screen hidden">

    <canvas id="gameCanvas"></canvas>


    <!-- HUD -->

    <div id="hud">

        <div class="hudLeft">

            <b id="playerName">Player</b>

            <div class="hpContainer">
                <span>HP</span>

                <div class="hpBar">
                    <div id="hp"></div>
                </div>

                <span id="hpText">100 / 100</span>
            </div>

            <div>
                Level:
                <b id="level">1</b>
            </div>

            <div>
                Score:
                <b id="score">0</b>
            </div>

            <div>
                Kill:
                <b id="kills">0</b>
            </div>

        </div>


        <div class="weapon">

            <b id="weaponName">
                PISTOL
            </b>

            <small id="weaponDamage">
                Damage 18
            </small>

        </div>


        <div class="hudRight">

            <button onclick="openCheat()">
                CHEAT
            </button>

            <button onclick="openLeaderboard()">
                LEADERBOARD
            </button>

        </div>

    </div>


    <!-- LEVEL -->

    <div id="levelText"></div>


    <!-- MOBILE CONTROLLER -->

    <div id="mobileController">

        <div id="joystick">

            <div id="stick"></div>

        </div>

        <button id="fireButton">
            FIRE
        </button>

    </div>


    <!-- CHEAT -->

    <div id="cheatMenu" class="modal hidden">

        <div class="modalBox">

            <h2>CHEAT CODE</h2>

            <input
                id="cheatInput"
                placeholder="Masukkan kode"
            >

            <p id="cheatError"></p>

            <button onclick="activateCheat()">
                AKTIFKAN
            </button>

            <button onclick="closeCheat()">
                TUTUP
            </button>

        </div>

    </div>


    <!-- LEADERBOARD -->

    <div id="leaderboardMenu" class="modal hidden">

        <div class="modalBox">

            <h2>LEADERBOARD</h2>

            <div id="leaderboard"></div>

            <button onclick="closeLeaderboard()">
                TUTUP
            </button>

        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver" class="modal hidden">

        <div class="modalBox">

            <h1>GAME OVER</h1>

            <p id="finalScore"></p>

            <button onclick="restartGame()">
                MAIN LAGI
            </button>

            <button onclick="backLogin()">
                KEMBALI
            </button>

        </div>

    </div>

</div>


<script src="game.js"></script>

</body>
      </html>
